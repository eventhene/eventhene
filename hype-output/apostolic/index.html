<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Apostolic Fire Conference 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Hype";
        src: url("assets/fonts/Inter-400.woff") format("woff");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Hype";
        src: url("assets/fonts/Inter-600.woff") format("woff");
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: "Hype";
        src: url("assets/fonts/Inter-800.woff") format("woff");
        font-weight: 800;
        font-display: block;
      }

      /* Palette taken from the flyer: fire on near-black. */
      #stage {
        --bg: #080406;
        --ink: #fff5ea;
        --muted: #c9ae95;
        --fire: #ff6b1a;
        --gold: #ffc24a;
        --energy: 0;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #080406; }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hype", system-ui, sans-serif;
        font-weight: 600;
        -webkit-font-smoothing: antialiased;
      }

      /* Fire bloom that breathes with the music, behind every scene. */
      #ember {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background:
          radial-gradient(900px 700px at 50% 108%, rgba(255, 107, 26, calc(0.08 + 0.2 * var(--energy))), transparent 70%),
          radial-gradient(700px 520px at 10% -10%, rgba(255, 194, 74, calc(0.03 + 0.08 * var(--energy))), transparent 70%);
      }

      .w { position: absolute; inset: 0; opacity: 0; }
      .fill { position: absolute; inset: 0; overflow: hidden; }
      .fill img { position: absolute; display: block; transform-origin: 50% 50%; }
      .scrim { position: absolute; inset: 0; }

      .eyebrow {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .col {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 140px;
        text-align: center;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="slot-s1" data-composition-id="s1" data-composition-src="compositions/s1.html"
        data-start="0" data-duration="5.03" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="slot-s2" data-composition-id="s2" data-composition-src="compositions/s2.html"
        data-start="4.53" data-duration="4.99" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="slot-s3" data-composition-id="s3" data-composition-src="compositions/s3.html"
        data-start="9.02" data-duration="4.49" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="slot-s4" data-composition-id="s4" data-composition-src="compositions/s4.html"
        data-start="13.01" data-duration="7.01" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="slot-s5" data-composition-id="s5" data-composition-src="compositions/s5.html"
        data-start="19.52" data-duration="5.5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="slot-s6" data-composition-id="s6" data-composition-src="compositions/s6.html"
        data-start="24.52" data-duration="5.48" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="ember"></div>

      <audio id="music" src="assets/music/music.mp3" data-start="0" data-duration="30"
        data-track-index="6" data-volume="0.55" data-fade-in="0.5" data-fade-out="1.6"></audio>
      <!-- the beat drop -->
      <audio id="sfx-boom" src="assets/sfx/boom.ogg" data-start="3.02" data-duration="0.57"
        data-track-index="7" data-volume="0.5"></audio>
      <!-- the call to action landing -->
      <audio id="sfx-hit" src="assets/sfx/hit.ogg" data-start="25.02" data-duration="0.18"
        data-track-index="7" data-volume="0.45"></audio>
    </div>

    <script src="assets/audio-data.js"></script>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });

        /* The fire bloom reads the music. Bass-weighted so it pulses on the kick
           rather than shimmering on the hats. */
        var stage = document.getElementById("stage");
        var A = window.AUDIO_DATA;
        if (A && A.frames && A.frames.length) {
          var FPS = A.fps || 30;
          var LAST = Math.min(A.frames.length, Math.ceil(30 * FPS));
          var smooth = 0;
          for (var f = 0; f < LAST; f++) {
            var fr = A.frames[f];
            var bass = (fr.bands[0] + fr.bands[1] + fr.bands[2]) / 3;
            var level = Math.min(1, bass * 0.78 + (fr.rms || 0) * 0.22);
            smooth = smooth * 0.55 + level * 0.45;
            tl.call(
              (function (v) {
                return function () {
                  stage.style.setProperty("--energy", v);
                };
              })(smooth.toFixed(3)),
              [],
              f / FPS
            );
          }
        }

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
