<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #s1-kicker {
          opacity: 0;
        }
        #s1-head {
          margin-top: 34px;
          font-size: 150px;
          font-weight: 800;
          line-height: 1.02;
          letter-spacing: -0.035em;
        }
        #s1-head span {
          display: block;
          opacity: 0;
        }
        #s1-l2 {
          color: var(--accent);
        }
        #s1-sub {
          margin-top: 36px;
          max-width: 900px;
          font-size: 36px;
          font-weight: 600;
          line-height: 1.4;
          color: var(--muted);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
        <div class="w" id="s1-w">
          <div class="pad">
            <div>
              <p id="s1-kicker" class="eyebrow">Now registering events in Ghana</p>
              <h1 id="s1-head">
                <span id="s1-l1">Your events,</span>
                <span id="s1-l2">elevated.</span>
              </h1>
              <p id="s1-sub">The operating system for event organizers in Africa.</p>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var E = "power3.out";
          tl.to("#s1-w", { opacity: 1, duration: 0.01 }, 0);
          // beat-grid: 0.56s, 1.09s, 1.64s, 2.73s
          tl.fromTo("#s1-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0.56);
          tl.fromTo("#s1-l1", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.55, ease: E }, 1.09);
          tl.fromTo("#s1-l2", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.55, ease: E }, 1.64);
          tl.fromTo("#s1-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 2.73);
          tl.to("#s1-w", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 5.7);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
