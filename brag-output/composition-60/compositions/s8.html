<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #svcs {
          display: flex;
          gap: 22px;
        }
        #svcs .sv {
          width: 340px;
          padding: 40px 34px;
          opacity: 0;
        }
        #svcs .t {
          font-size: 38px;
          font-weight: 800;
          letter-spacing: -0.025em;
        }
        #svcs .d {
          margin-top: 12px;
          font-size: 22px;
          font-weight: 600;
          color: var(--muted);
        }
      </style>

      <div id="root" data-composition-id="s8" data-width="1920" data-height="1080">
        <div class="w" id="s8-w">
          <div class="col">
            <h2 class="sec-h" id="s8-h">A full creative team, on call.</h2>
            <div id="svcs">
              <div class="sv card" id="sv1"><p class="t">Graphic design</p><p class="d">Flyers, stories, social kits</p></div>
              <div class="sv card" id="sv2"><p class="t">Social media</p><p class="d">Targeted IG, TikTok, WA</p></div>
              <div class="sv card" id="sv3"><p class="t">Livestream</p><p class="d">Multi-cam broadcast</p></div>
              <div class="sv card" id="sv4"><p class="t">Photography</p><p class="d">Pro on the day</p></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var E = "power3.out";
          tl.to("#s8-w", { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 0.05);
          tl.fromTo("#s8-h", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 0.53);
          // beat-grid: cards at 50.20s, 50.74s, 51.29s, 51.83s global (slot starts at 49.11s)
          var ids = ["#sv1", "#sv2", "#sv3", "#sv4"];
          var at = [1.09, 1.63, 2.18, 2.72];
          for (var i = 0; i < ids.length; i++) {
            tl.fromTo(ids[i], { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.35, ease: E }, at[i]);
          }
          tl.to("#s8-w", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 4.05);
          window.__timelines["s8"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
