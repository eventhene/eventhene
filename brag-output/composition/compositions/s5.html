<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #s5-col {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 42px;
        }
        #s5-logo {
          width: 460px;
          height: auto;
          display: block;
          opacity: 0;
          filter: drop-shadow(0 0 calc(24px + 38px * var(--energy)) rgba(212, 168, 83, 0.4));
        }
        #s5-line {
          font-size: 50px;
          font-weight: 800;
          letter-spacing: -0.025em;
          opacity: 0;
        }
        #s5-foot {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 22px;
        }
        #s5-rule {
          width: 300px;
          height: 2px;
          background: linear-gradient(90deg, transparent, var(--accent), transparent);
          opacity: 0;
        }
        #s5-dom {
          font-size: 30px;
          font-weight: 800;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: var(--accent);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="s5" data-width="1920" data-height="1080">
        <div class="w" id="s5-w">
          <div id="s5-col">
            <img id="s5-logo" src="assets/img/logo-full.png" alt="EventHene" />
            <p id="s5-line">Know exactly who showed up.</p>
            <div id="s5-foot">
              <div id="s5-rule"></div>
              <p id="s5-dom">eventhene.com</p>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var E = "power3.out";
          tl.to("#s5-w", { opacity: 1, duration: 0.01 }, 0.02);
          // beat-grid: the logo lands on the 17.47s beat (host starts at 17.0s)
          tl.fromTo("#s5-logo", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: E }, 0.47);
          tl.fromTo("#s5-line", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 0.95);
          // beat-locked: the rule sweep and the domain land on the 18.55s strong cue
          tl.fromTo("#s5-rule", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: E }, 1.55);
          tl.fromTo("#s5-dom", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: E }, 1.62);
          window.__timelines["s5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
